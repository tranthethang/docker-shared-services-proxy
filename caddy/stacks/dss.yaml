# Default DSS stack (DSS_NAME unset): Traefik network traefik_proxy.
# One file per stack. Add stacks/<name>.yaml and sites/<name>.caddy for more.
services:
  caddy:
    networks:
      traefik_proxy:
        # Containers on this network that call the public MinIO URLs reach
        # Caddy (TLS), which proxies to Traefik. DSS Traefik no longer owns them.
        aliases:
          - minio.dss.localhost
          - s3.minio.dss.localhost

networks:
  traefik_proxy:
    name: traefik_proxy
    external: true
